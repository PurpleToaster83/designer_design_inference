<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/potion_fav.png">

    <link rel="stylesheet" href="styling.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.0/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.0/angular-sanitize.js"></script>
    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Initialize Firebase -->
    <script src="https://dkgbelief.firebaseapp.com/__/firebase/init.js"></script>
    <!-- Experiment App -->
    <script src="lib/preloader.js"></script>
    <!-- <script src="app.js"></script> -->

    <title>Designer Pragmatic Design Inference</title>
</head>
<body>
    <div class="container">
        <h1><span class="flask-emoji">🧪</span> Gridworld Flask Assignment</h1>
        <div class="grid-container" id="grid"></div>
    </div>

    <div class="sidebar">
        <h2>Available Flasks</h2>
        <div class="flasks-container" id="flasks-container">
            <div class="flask potion" draggable="true" data-flask="potion"></div>
            <div class="flask potion" draggable="true" data-flask="potion"></div>
            <div class="flask poison" draggable="true" data-flask="poison"></div>
        </div>
        
        <div class="status" id="status">0/4 squares assigned</div>
        <button class="reset-button" onClick="resetAssignments()">Reset All</button>
        <br><br><br>
        <button class="submit-button" onClick="submitAssignment()">Submit Layout</button>
    </div>

    <div class="instructions">
        <h1 class="instructions header"><u>Game Instructions</u></h1>
        <p class="instructions paragraph">
            Welcome to our flask placement game!
            <br><br><br>
            The map designer, you, will place an assortment of flasks (purple potions <img class="caption-image" src="images/potion.png"> and green poisons <img class="caption-image" src="images/poison.png">) in the yellow square slots.
            <br><br><br>
            Press <strong>Next</strong> to continue.</p>
    </div>

    <script src="app.js"></script>

    </body>
</html>
