<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridworld Flask Assignment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flask-emoji {
            font-size: 1.2em;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 2px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .grid-cell {
            background: #f0f0f0;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .grid-cell.target {
            background: #ffd700;
            border-color: #ffb347;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .grid-cell.target.occupied {
            background: #ffb347;
        }

        .grid-cell.drop-target {
            background: #90EE90;
            border-color: #32CD32;
            box-shadow: 0 0 15px rgba(50, 205, 50, 0.7);
            transform: scale(1.05);
        }

        .sidebar {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 200px;
        }

        .sidebar h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .flasks-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .flask {
            width: 60px;
            height: 80px;
            border-radius: 30px 30px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .flask:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .flask.dragging {
            opacity: 0.7;
            transform: scale(1.1);
            z-index: 1000;
        }

        .flask.red {
            background: linear-gradient(145deg, #ff6b6b, #ee5a52);
        }

        .flask.blue {
            background: linear-gradient(145deg, #4ecdc4, #45b7b8);
        }

        .flask.green {
            background: linear-gradient(145deg, #55a3ff, #3742fa);
        }

        .flask.assigned {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .reset-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(145deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .flask-in-grid {
            width: 40px;
            height: 50px;
            border-radius: 20px 20px 8px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .flask-in-grid:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 10px;
            }
            
            .grid-container {
                grid-template-columns: repeat(8, 40px);
                grid-template-rows: repeat(8, 40px);
            }
            
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="flask-emoji">🧪</span> Gridworld Flask Assignment</h1>
        <div class="grid-container" id="grid"></div>
    </div>

    <div class="sidebar">
        <h2>Available Flasks</h2>
        <div class="flasks-container" id="flasks-container">
            <div class="flask red" draggable="true" data-flask="red">R</div>
            <div class="flask blue" draggable="true" data-flask="blue">B</div>
            <div class="flask green" draggable="true" data-flask="green">G</div>
        </div>
        
        <div class="status" id="status">0/4 squares assigned</div>
        
        <button class="reset-button" onclick="resetAssignments()">Reset All</button>
    </div>

    <script>
        // Grid setup - 8x8 grid with 4 yellow target squares
        const gridSize = 8;
        const targetSquares = [
            {row: 1, col: 1}, // Top-left corner area
            {row: 1, col: 6}, // Top-right corner area
            {row: 6, col: 1}, // Bottom-left corner area
            {row: 6, col: 6}  // Bottom-right corner area
        ];

        let assignments = {}; // Track which flasks are assigned to which squares
        let assignedCount = 0;

        // Initialize grid
        function initializeGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // Check if this cell is a target square
                    const isTarget = targetSquares.some(target => target.row === row && target.col === col);
                    if (isTarget) {
                        cell.classList.add('target');
                    }
                    
                    // Add drop event listeners
                    cell.addEventListener('dragover', handleDragOver);
                    cell.addEventListener('drop', handleDrop);
                    cell.addEventListener('dragenter', handleDragEnter);
                    cell.addEventListener('dragleave', handleDragLeave);
                    cell.addEventListener('click', handleCellClick);
                    
                    grid.appendChild(cell);
                }
            }
        }

        // Initialize flasks
        function initializeFlasks() {
            const flasks = document.querySelectorAll('.flask');
            flasks.forEach(flask => {
                flask.addEventListener('dragstart', handleDragStart);
                flask.addEventListener('dragend', handleDragEnd);
            });
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            if (e.target.classList.contains('assigned')) {
                e.preventDefault();
                return;
            }
            
            e.dataTransfer.setData('text/plain', e.target.dataset.flask);
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.currentTarget.classList.contains('target') && !e.currentTarget.classList.contains('occupied')) {
                e.preventDefault();
            }
        }

        function handleDragEnter(e) {
            if (e.currentTarget.classList.contains('target') && !e.currentTarget.classList.contains('occupied')) {
                e.currentTarget.classList.add('drop-target');
            }
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drop-target');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drop-target');
            
            if (!e.currentTarget.classList.contains('target') || e.currentTarget.classList.contains('occupied')) {
                return;
            }
            
            const flaskType = e.dataTransfer.getData('text/plain');
            const row = parseInt(e.currentTarget.dataset.row);
            const col = parseInt(e.currentTarget.dataset.col);
            
            assignFlask(flaskType, row, col);
        }

        function handleCellClick(e) {
            if (e.currentTarget.classList.contains('occupied')) {
                const row = parseInt(e.currentTarget.dataset.row);
                const col = parseInt(e.currentTarget.dataset.col);
                removeFlask(row, col);
            }
        }

        function assignFlask(flaskType, row, col) {
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const flask = document.querySelector(`[data-flask="${flaskType}"]`);
            
            if (!cell || !flask || flask.classList.contains('assigned')) return;
            
            // Create flask in grid
            const flaskInGrid = document.createElement('div');
            flaskInGrid.className = `flask-in-grid ${flaskType}`;
            flaskInGrid.textContent = flask.textContent;
            flaskInGrid.dataset.flask = flaskType;
            
            cell.appendChild(flaskInGrid);
            cell.classList.add('occupied');
            
            // Mark original flask as assigned
            flask.classList.add('assigned');
            
            // Track assignment
            assignments[`${row}-${col}`] = flaskType;
            assignedCount++;
            
            updateStatus();
        }

        function removeFlask(row, col) {
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const flaskInGrid = cell.querySelector('.flask-in-grid');
            
            if (!flaskInGrid) return;
            
            const flaskType = flaskInGrid.dataset.flask;
            const originalFlask = document.querySelector(`[data-flask="${flaskType}"]`);
            
            // Remove from grid
            cell.removeChild(flaskInGrid);
            cell.classList.remove('occupied');
            
            // Restore original flask
            originalFlask.classList.remove('assigned');
            
            // Remove from assignments
            delete assignments[`${row}-${col}`];
            assignedCount--;
            
            updateStatus();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `${assignedCount}/4 squares assigned`;
        }

        function resetAssignments() {
            // Clear all assignments
            Object.keys(assignments).forEach(key => {
                const [row, col] = key.split('-').map(Number);
                removeFlask(row, col);
            });
        }

        // Initialize the app
        initializeGrid();
        initializeFlasks();
        updateStatus();
    </script>
</body>
</html>
